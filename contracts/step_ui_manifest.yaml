    widget_type: artifact_picker
    required: false
    help_text: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_element
    label: Record element
    widget_type: text
    required: true
    help_text: The repeating element that is one record, for example item, product or g:item (with its
      prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
  - name: namespaces
    label: Namespace prefixes
    widget_type: json
    required: false
    help_text: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  - name: records_per_part
    label: Records per part
    widget_type: number
    required: true
    help_text: How many records each part holds.
  - name: copy_header
    label: Copy header
    widget_type: boolean
    required: false
    help_text: Copy the elements before the first record (such as a channel's title) into every part.
      Default on.
- operation_id: format_xml
