- operation_id: canonicalize_xml
  title: Canonicalize XML
  fields:
  - name: xml
    label: XML
    widget_type: textarea
    required: false
    help_text: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    label: XML file
    widget_type: artifact_picker
    required: false
    help_text: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: method
    label: Method
    widget_type: select
