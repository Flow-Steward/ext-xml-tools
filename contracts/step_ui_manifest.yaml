- operation_id: compare_xml
  title: Compare XML documents
  fields:
  - name: left_xml
    label: First document
    widget_type: textarea
    required: false
    help_text: The first document as text. Give it here or as a file, not both.
  - name: left_file
    label: First document file
    widget_type: artifact_picker
    required: false
    help_text: The first document as a workflow file (for example from File Transfer), or give it as text
      instead.
  - name: right_xml
    label: Second document
    widget_type: textarea
    required: false
    help_text: The second document as text. Give it here or as a file, not both.
  - name: right_file
    label: Second document file
    widget_type: artifact_picker
    required: false
    help_text: The second document as a workflow file (for example from File Transfer), or give it as
      text instead.
  - name: ignore_whitespace
    label: Ignore whitespace
    widget_type: boolean
    required: false
    help_text: Compare text with surrounding whitespace removed and runs of spaces as one. Default on.
  - name: ignore_comments
    label: Ignore comments
    widget_type: boolean
    required: false
    help_text: Default on.
  - name: ignore_prefixes
    label: Ignore prefixes
    widget_type: boolean
    required: false
    help_text: Compare names by namespace URI, not by prefix. Default on.
  - name: max_differences
    label: Max differences
    widget_type: number
    required: false
    help_text: List at most this many. Default 100.
