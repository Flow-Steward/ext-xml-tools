    - label: ISO-8859-13
      value: ISO-8859-13
    - label: ISO-8859-15
      value: ISO-8859-15
    - label: windows-1250
      value: windows-1250
    - label: windows-1251
      value: windows-1251
    - label: windows-1252
      value: windows-1252
    - label: windows-1257
      value: windows-1257
    - label: US-ASCII
      value: US-ASCII
  - name: xml_declaration
