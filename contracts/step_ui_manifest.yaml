forms:
- operation_id: parse_xml
  title: Parse XML to records
  fields:
  - name: xml
    label: XML
    widget_type: textarea
    required: false
    help_text: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    label: XML file
    widget_type: artifact_picker
    required: false
    help_text: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_xpath
    label: Record XPath
    widget_type: text
    required: false
    help_text: XPath 1.0 selecting the record elements. Default /*/* (every child of the root).
  - name: namespaces
    label: Namespace prefixes
    widget_type: json
    required: false
    help_text: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  - name: flatten
    label: Flatten
    widget_type: boolean
    required: false
    help_text: Turn nested values into flat keys such as price.@currency and images.image.0.
  - name: max_records
    label: Max records
    widget_type: number
    required: false
    help_text: Return at most this many records. Default 10000.
  - name: attribute_prefix
    label: Attribute prefix
    widget_type: text
    required: false
    help_text: Put before attribute names in the JSON. Default @.
  - name: text_key
    label: Text key
    widget_type: text
    required: false
    help_text: 'The JSON key for an element''s text when it also has attributes or children. Default #text.'
  - name: namespace_mode
    label: Namespaces in names
    widget_type: select
    required: false
    help_text: keep writes names as the document does (g:price) with their declarations as @xmlns keys;
      strip keeps local names only. Default keep.
    options:
    - label: keep
      value: keep
    - label: strip
      value: strip
  - name: force_list
    label: Always lists
    widget_type: json
    required: false
    help_text: Element names that are always a JSON list, even when they occur once.
