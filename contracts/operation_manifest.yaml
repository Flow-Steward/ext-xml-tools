- operation_id: xml_to_csv
  display_name: Convert XML to CSV
  description: Writes one CSV row per record element, reading the file element by element. Columns are
    given as XPaths or taken from the records' fields.
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_element
    value_type: text
    required: true
    schema:
      type: string
      title: Record element
      description: The repeating element that is one record, for example item, product or g:item (with
        its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
      maxLength: 200
  - name: namespaces
    value_type: object
    required: false
    schema:
      type: object
      title: Namespace prefixes
      description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
        A prefix here need not match the document''s own.'
  - name: columns
    value_type: array
    required: false
    schema:
      type: array
      title: Columns
      description: 'Optional: [{"name": "price", "xpath": "g:price"}, …], each XPath relative to the record.
        Without it the columns are the record''s flattened fields in the order they first occur.'
  - name: delimiter
    value_type: text
    required: false
    schema:
      type: string
      title: Delimiter
      description: comma (default), semicolon, tab or pipe.
      enum:
      - comma
      - semicolon
      - tab
      - pipe
      default: comma
  - name: header
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Header row
      description: Write the column names first. Default on.
      default: true
  - name: excel_bom
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Excel BOM
      description: Start the file with a UTF-8 byte order mark so Excel reads letters like ą, č correctly.
        Default off.
      default: false
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The CSV (UTF-8), as a workflow file.
  - name: csv
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The CSV as text, when it is at most 256 KiB.
  - name: record_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Rows written (without the header).
  - name: columns
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: The column names.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.csv
  - result.record_count
  - result.columns
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
