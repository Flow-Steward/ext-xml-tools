- operation_id: edit_xml
  display_name: Edit XML
  description: 'Applies changes in order, each to the nodes an XPath selects: set text, set or remove
    an attribute, insert an XML fragment, replace, rename or remove. By default a change that selects
    nothing stops the step.'
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: changes
    value_type: array
    required: true
    schema:
      type: array
      title: Changes
      description: 'For example [{"action": "set_text", "xpath": "//item[@id=''7'']/price", "value": "9.99"},
        {"action": "remove", "xpath": "//item[stock=0]"}]. Actions: set_text, set_attribute, remove_attribute,
        insert (append, prepend, before or after), replace, rename, remove.'
  - name: namespaces
    value_type: object
    required: false
    schema:
      type: object
      title: Namespace prefixes
      description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
        A prefix here need not match the document''s own.'
  - name: require_match
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Every change must match
      description: Stop when a change selects nothing. Default on.
      default: true
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The XML, as a workflow file.
  - name: xml
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The XML as text, when it is at most 256 KiB.
  - name: applied
    value_type: array
    schema:
      type: array
      items:
        type: object
      description: Each change and how many nodes it changed.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.xml
  - result.applied
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_xpath
  - no_match
  - invalid_name
