  - name: xml_declaration
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: XML declaration
      description: Start with <?xml version="1.0" encoding="…"?>. Default on.
      default: true
  - name: pretty
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Indent
      description: Indent the XML for reading. Default on.
      default: true
  outputs:
