      - comma
      - semicolon
      - tab
      - pipe
      default: comma
  - name: csv_encoding
    value_type: text
    required: false
    schema:
      type: string
      title: CSV file encoding
      description: The file's encoding. Default UTF-8 (a byte order mark is removed).
      enum:
      - UTF-8
      - UTF-16
      - ISO-8859-1
      - ISO-8859-2
      - ISO-8859-13
      - ISO-8859-15
      - windows-1250
      - windows-1251
      - windows-1252
      - windows-1257
      - US-ASCII
      default: UTF-8
  - name: root_element
    value_type: text
    required: false
    schema:
