    schema:
      type:
      - string
      - 'null'
      description: The XML, as a workflow file.
  - name: xml
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The XML as text, when it is at most 256 KiB.
  - name: record_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Rows written.
  - name: columns
    value_type: array
    schema:
      type: array
      items:
        type: object
      description: Each column and its element name.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.xml
  - result.record_count
  - result.columns
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_csv
  - invalid_name
  - invalid_xml_character
  - artifact_input_unavailable
  - artifact_output_unavailable
