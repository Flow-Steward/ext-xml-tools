- operation_id: merge_xml
  display_name: Merge XML documents
  description: 'Joins documents into the first one: the records the XPath selects in each further document
    are added after the last record of the first (for example every item of several feeds into one rss/channel).'
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml_list
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
      title: Documents as text
      description: The documents as texts, in order. Files come first, then these.
  - name: xml_files
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
      title: Documents as files
      description: The documents as workflow files, in order (for example from File Transfer).
  - name: record_xpath
    value_type: text
    required: false
    schema:
      type: string
      title: Record XPath
      description: XPath 1.0 selecting the records in each document. Default /*/*.
      default: /*/*
      maxLength: 2000
  - name: namespaces
    value_type: object
    required: false
    schema:
      type: object
      title: Namespace prefixes
      description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
        A prefix here need not match the document''s own.'
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The XML, as a workflow file.
  - name: xml
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The XML as text, when it is at most 256 KiB.
  - name: document_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Documents merged.
  - name: record_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Records in the result.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.xml
  - result.document_count
  - result.record_count
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_xpath
  - artifact_input_unavailable
  - artifact_output_unavailable
- operation_id: split_xml
  display_name: Split XML document
  description: Splits a large document into parts of a set number of records, reading it element by element.
    Each part keeps the elements around the records (for example rss and channel) and, if wanted, the
    elements before the first record. The parts come as one ZIP file.
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_element
    value_type: text
    required: true
    schema:
      type: string
      title: Record element
      description: The repeating element that is one record, for example item, product or g:item (with
        its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
      maxLength: 200
  - name: namespaces
    value_type: object
    required: false
    schema:
      type: object
      title: Namespace prefixes
      description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
        A prefix here need not match the document''s own.'
  - name: records_per_part
    value_type: integer
    required: true
    schema:
      type: integer
      title: Records per part
      description: How many records each part holds.
      minimum: 1
      maximum: 1000000
  - name: copy_header
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Copy header
      description: Copy the elements before the first record (such as a channel's title) into every part.
        Default on.
      default: true
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The parts part-00001.xml, … in a ZIP file.
  - name: part_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Parts written.
  - name: record_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Records in all parts.
  - name: parts
    value_type: array
    schema:
      type: array
      items:
        type: object
      description: Each part's file name and record count.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.part_count
  - result.record_count
  - result.parts
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_name
  - artifact_input_unavailable
  - artifact_output_unavailable
- operation_id: format_xml
  display_name: Format XML
  description: Indents a document for reading, or minifies it by removing whitespace between elements.
    Text with content is kept as it is; xml:space="preserve" is respected when minifying.
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: mode
    value_type: text
    required: false
    schema:
      type: string
      title: Mode
      description: pretty (default) or minify.
      enum:
      - pretty
      - minify
      default: pretty
  - name: indent
    value_type: integer
    required: false
    schema:
      type: integer
      title: Indent
      description: Spaces per level. Default 2.
      default: 2
      minimum: 0
      maximum: 8
  - name: remove_comments
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Remove comments
      description: Default off.
      default: false
  - name: encoding
    value_type: text
    required: false
    schema:
      type: string
      title: Encoding
      description: 'Re-encode to this encoding. Default: keep the document''s.'
      enum:
      - UTF-8
      - UTF-16
      - ISO-8859-1
      - ISO-8859-2
      - ISO-8859-13
      - ISO-8859-15
      - windows-1250
      - windows-1251
      - windows-1252
      - windows-1257
      - US-ASCII
  - name: xml_declaration
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: XML declaration
      description: Start with <?xml version="1.0" encoding="…"?>. Default on.
      default: true
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The XML, as a workflow file.
  - name: xml
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The XML as text, when it is at most 256 KiB.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.xml
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
  - artifact_output_unavailable
- operation_id: canonicalize_xml
  display_name: Canonicalize XML
  description: Writes the canonical form of a document (C14N 1.0, exclusive C14N or C14N 2.0) and its
    SHA-256, so two documents with the same content compare equal byte for byte.
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: method
    value_type: text
    required: false
    schema:
      type: string
      title: Method
      description: c14n (default, inclusive 1.0), c14n_exclusive or c14n2.
      enum:
      - c14n
      - c14n_exclusive
      - c14n2
      default: c14n
  - name: with_comments
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: With comments
      description: Default off.
      default: false
  - name: inclusive_prefixes
    value_type: array
    required: false
    schema:
      type: array
      title: Inclusive prefixes
      description: 'For c14n_exclusive: namespace prefixes to keep as in inclusive C14N.'
  outputs:
  - name: file
    value_type: artifact_handle
    schema:
      type:
      - string
      - 'null'
      description: The XML, as a workflow file.
  - name: xml
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The XML as text, when it is at most 256 KiB.
  - name: size_bytes
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The result file's size.
  - name: sha256
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The result file's SHA-256.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.file
  - result.xml
  - result.size_bytes
  - result.sha256
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
  - artifact_output_unavailable
- operation_id: compare_xml
  display_name: Compare XML documents
  description: 'Compares two documents element by element and lists the differences with their paths:
    names, attributes, text and missing or extra elements. Attribute order never counts.'
  operation_kind: source
  category: data
  workflow_visible: true
  inputs:
  - name: left_xml
    value_type: text
    required: false
    schema:
      type: string
      title: First document
      description: The first document as text. Give it here or as a file, not both.
  - name: left_file
    value_type: artifact_handle
    required: false
    description: The first document as a workflow file (for example from File Transfer), or give it as
      text instead.
  - name: right_xml
    value_type: text
    required: false
    schema:
      type: string
      title: Second document
      description: The second document as text. Give it here or as a file, not both.
  - name: right_file
    value_type: artifact_handle
    required: false
    description: The second document as a workflow file (for example from File Transfer), or give it as
      text instead.
  - name: ignore_whitespace
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Ignore whitespace
      description: Compare text with surrounding whitespace removed and runs of spaces as one. Default
        on.
      default: true
  - name: ignore_comments
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Ignore comments
      description: Default on.
      default: true
  - name: ignore_prefixes
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Ignore prefixes
      description: Compare names by namespace URI, not by prefix. Default on.
      default: true
  - name: max_differences
    value_type: integer
    required: false
    schema:
      type: integer
      title: Max differences
      description: List at most this many. Default 100.
      default: 100
      minimum: 1
      maximum: 1000
  outputs:
  - name: equal
    value_type: boolean
    schema:
      type:
      - boolean
      - 'null'
      description: True when no difference was found.
  - name: difference_count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Differences found.
  - name: differences
    value_type: array
    schema:
      type: array
      items:
        type: object
      description: 'Each difference: path, kind, first, second.'
  - name: truncated
    value_type: boolean
    schema:
      type:
      - boolean
      - 'null'
      description: True when more differences exist than are listed.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
  - result.equal
  - result.difference_count
  - result.differences
  - result.truncated
  - result.warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
