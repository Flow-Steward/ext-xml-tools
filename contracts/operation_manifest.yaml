  - artifact_output_unavailable
- operation_id: csv_to_xml
  display_name: Convert CSV to XML
  description: 'Turns a CSV with a header row into XML: one record element per row, one child element
    (or attribute) per column. Column names that are not valid XML names are adjusted and the warnings
    say how.'
  operation_kind: action
  category: data
  workflow_visible: true
  inputs:
  - name: csv
    value_type: text
    required: false
