operations:
- operation_id: parse_xml
  display_name: Parse XML to records
  description: 'Turns an XML document into JSON records: each element the record XPath selects becomes
    one record, with attributes as @name, repeated elements as lists and mixed text kept in order. For
    files too large for the step output use Parse large XML to JSONL file.'
  operation_kind: source
  category: data
  workflow_visible: true
  inputs:
  - name: xml
    value_type: text
    required: false
    schema:
      type: string
      title: XML
      description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    value_type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_xpath
    value_type: text
    required: false
    schema:
      type: string
      title: Record XPath
      description: XPath 1.0 selecting the record elements. Default /*/* (every child of the root).
      default: /*/*
      maxLength: 2000
  - name: namespaces
    value_type: object
    required: false
    schema:
      type: object
      title: Namespace prefixes
      description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
        A prefix here need not match the document''s own.'
  - name: flatten
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Flatten
      description: Turn nested values into flat keys such as price.@currency and images.image.0.
      default: false
  - name: max_records
    value_type: integer
    required: false
    schema:
      type: integer
      title: Max records
      description: Return at most this many records. Default 10000.
      default: 10000
      minimum: 1
      maximum: 100000
  - name: attribute_prefix
    value_type: text
    required: false
    schema:
      type: string
      title: Attribute prefix
      description: Put before attribute names in the JSON. Default @.
      default: '@'
      maxLength: 5
  - name: text_key
    value_type: text
    required: false
    schema:
      type: string
      title: Text key
      description: 'The JSON key for an element''s text when it also has attributes or children. Default
        #text.'
      default: '#text'
      maxLength: 20
  - name: namespace_mode
    value_type: text
    required: false
    schema:
      type: string
      title: Namespaces in names
      description: keep writes names as the document does (g:price) with their declarations as @xmlns
        keys; strip keeps local names only. Default keep.
      enum:
      - keep
      - strip
      default: keep
  - name: force_list
    value_type: array
    required: false
    schema:
      type: array
      title: Always lists
      description: Element names that are always a JSON list, even when they occur once.
  outputs:
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
      description: The records as JSON objects.
  - name: count
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Records returned.
  - name: total
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Records the XPath selected.
  - name: truncated
    value_type: boolean
    schema:
      type:
      - boolean
      - 'null'
      description: True when more records matched than were returned.
  - name: root_element
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The root element's name.
  - name: warnings
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: What the step could not do fully or what to check.
  result_fields:
