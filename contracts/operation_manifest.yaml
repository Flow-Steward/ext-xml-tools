      description: The root element's name. Default rows.
      default: rows
      maxLength: 200
  - name: record_element
    value_type: text
    required: false
    schema:
      type: string
      title: Record element
      description: One element per row. Default row.
      default: row
      maxLength: 200
  - name: attribute_columns
    value_type: array
    required: false
    schema:
      type: array
      title: Columns as attributes
      description: Columns written as attributes of the record element instead of child elements.
  - name: skip_empty
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Skip empty cells
      description: 'Leave out elements for empty cells. Default off: an empty cell is an empty element.'
      default: false
  - name: encoding
    value_type: text
    required: false
    schema:
      type: string
      title: Encoding
      description: The encoding of the XML written, named in its declaration. Default UTF-8.
      enum:
      - UTF-8
      - UTF-16
      - ISO-8859-1
      - ISO-8859-2
      - ISO-8859-13
      - ISO-8859-15
      - windows-1250
      - windows-1251
      - windows-1252
      - windows-1257
      - US-ASCII
