page_id: support
title: Support
description: Where to report a problem, ask a question or request a feature.
project_scoped: false
components:
  - component_id: support_contact
    type: markdown
    title: Contact the developers
    body: |
      This extension is maintained in a public GitHub repository. Use it to report a problem, ask a question or request a feature; the developers answer there.

      - [Report a problem or request a feature](https://github.com/Flow-Steward/ext-xml-tools/issues/new/choose)
      - [Browse existing issues](https://github.com/Flow-Steward/ext-xml-tools/issues)
      - [Documentation and source code](https://github.com/Flow-Steward/ext-xml-tools)

      Opening an issue needs a GitHub account. Check the existing issues first: someone may already have reported the same problem.
  - component_id: support_report
    type: markdown
    title: What to include in a report
    body: |
      - The extension version and your Flow Steward version.
      - The step, what you expected and what happened instead, with the exact error message (it gives a line and column).
      - If you can, a small XML sample that shows the problem, with all real data removed.

      Issues are public. Never include passwords, API keys, tokens or customer data.
