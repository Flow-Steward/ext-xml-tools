- component_id: steps_edit
  type: markdown
  title: Edit
  body: |
    ### Edit XML

    Applies changes in order, each to the nodes an XPath selects: set text, set or remove an attribute, insert an XML fragment, replace, rename or remove. By default a change that selects nothing stops the step.

    Action id `edit_xml` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `changes` (list, required): For example [{"action": "set_text", "xpath": "//item[@id='7']/price", "value": "9.99"}, {"action": "remove", "xpath": "//item[stock=0]"}]. Actions: set_text, set_attribute, remove_attribute, insert (append, prepend, before or after), replace, rename, remove.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `require_match` (yes/no): Stop when a change selects nothing. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `applied` (list): Each change and how many nodes it changed.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Merge XML documents

    Joins documents into the first one: the records the XPath selects in each further document are added after the last record of the first (for example every item of several feeds into one rss/channel).

    Action id `merge_xml` · saves a file

    **Inputs**

    - `xml_list` (list): The documents as texts, in order. Files come first, then these.
    - `xml_files` (list): The documents as workflow files, in order (for example from File Transfer).
    - `record_xpath` (text): XPath 1.0 selecting the records in each document. Default /*/*.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `document_count` (whole number): Documents merged.
    - `record_count` (whole number): Records in the result.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Split XML document

    Splits a large document into parts of a set number of records, reading it element by element. Each part keeps the elements around the records (for example rss and channel) and, if wanted, the elements before the first record. The parts come as one ZIP file.

    Action id `split_xml` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `record_element` (text, required): The repeating element that is one record, for example item, product or g:item (with its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `records_per_part` (whole number, required): How many records each part holds.
    - `copy_header` (yes/no): Copy the elements before the first record (such as a channel's title) into every part. Default on.

    **Results**

    - `file` (workflow file): The parts part-00001.xml, … in a ZIP file.
    - `part_count` (whole number): Parts written.
    - `record_count` (whole number): Records in all parts.
    - `parts` (list): Each part's file name and record count.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_utility
  type: markdown
  title: Format and compare
  body: |
    ### Format XML

    Indents a document for reading, or minifies it by removing whitespace between elements. Text with content is kept as it is; xml:space="preserve" is respected when minifying.

    Action id `format_xml` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `mode` (text): pretty (default) or minify.
    - `indent` (whole number): Spaces per level. Default 2.
    - `remove_comments` (yes/no): Default off.
    - `encoding` (text): Re-encode to this encoding. Default: keep the document's.
    - `xml_declaration` (yes/no): Start with <?xml version="1.0" encoding="…"?>. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Canonicalize XML

    Writes the canonical form of a document (C14N 1.0, exclusive C14N or C14N 2.0) and its SHA-256, so two documents with the same content compare equal byte for byte.

    Action id `canonicalize_xml` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `method` (text): c14n (default, inclusive 1.0), c14n_exclusive or c14n2.
    - `with_comments` (yes/no): Default off.
    - `inclusive_prefixes` (list): For c14n_exclusive: namespace prefixes to keep as in inclusive C14N.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Compare XML documents

    Compares two documents element by element and lists the differences with their paths: names, attributes, text and missing or extra elements. Attribute order never counts.

    Action id `compare_xml` · returns values

    **Inputs**

    - `left_xml` (text): The first document as text. Give it here or as a file, not both.
    - `left_file` (workflow file): The first document as a workflow file (for example from File Transfer), or give it as text instead.
    - `right_xml` (text): The second document as text. Give it here or as a file, not both.
    - `right_file` (workflow file): The second document as a workflow file (for example from File Transfer), or give it as text instead.
    - `ignore_whitespace` (yes/no): Compare text with surrounding whitespace removed and runs of spaces as one. Default on.
    - `ignore_comments` (yes/no): Default on.
    - `ignore_prefixes` (yes/no): Compare names by namespace URI, not by prefix. Default on.
    - `max_differences` (whole number): List at most this many. Default 100.

    **Results**

    - `equal` (yes/no): True when no difference was found.
    - `difference_count` (whole number): Differences found.
    - `differences` (list): Each difference: path, kind, first, second.
    - `truncated` (yes/no): True when more differences exist than are listed.
    - `warnings` (list): What the step could not do fully or what to check.
