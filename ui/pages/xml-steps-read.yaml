- component_id: steps_read
  type: markdown
  title: Read
  body: |
    ### Parse XML to records

    Turns an XML document into JSON records: each element the record XPath selects becomes one record, with attributes as @name, repeated elements as lists and mixed text kept in order. For files too large for the step output use Parse large XML to JSONL file.

    Action id `parse_xml` · returns values

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `record_xpath` (text): XPath 1.0 selecting the record elements. Default /*/* (every child of the root).
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `flatten` (yes/no): Turn nested values into flat keys such as price.@currency and images.image.0.
    - `max_records` (whole number): Return at most this many records. Default 10000.
    - `attribute_prefix` (text): Put before attribute names in the JSON. Default @.
    - `text_key` (text): The JSON key for an element's text when it also has attributes or children. Default #text.
    - `namespace_mode` (text): keep writes names as the document does (g:price) with their declarations as @xmlns keys; strip keeps local names only. Default keep.
    - `force_list` (list): Element names that are always a JSON list, even when they occur once.

    **Results**

    - `records` (list): The records as JSON objects.
    - `count` (whole number): Records returned.
    - `total` (whole number): Records the XPath selected.
    - `truncated` (yes/no): True when more records matched than were returned.
    - `root_element` (text): The root element's name.
    - `warnings` (list): What the step could not do fully or what to check.

    Example: A supplier feed with `product` elements under the root gives one record per product.

    ### Parse large XML to JSONL file

    Reads a large XML file element by element and writes one JSON record per record element to a JSONL file, without loading the whole file. Returns the count and the first records as a sample.

    Action id `parse_xml_stream` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `record_element` (text, required): The repeating element that is one record, for example item, product or g:item (with its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `flatten` (yes/no): Turn nested values into flat keys such as price.@currency and images.image.0.
    - `max_records` (whole number): Stop after this many records. Empty: all.
    - `attribute_prefix` (text): Put before attribute names in the JSON. Default @.
    - `text_key` (text): The JSON key for an element's text when it also has attributes or children. Default #text.
    - `namespace_mode` (text): keep writes names as the document does (g:price) with their declarations as @xmlns keys; strip keeps local names only. Default keep.
    - `force_list` (list): Element names that are always a JSON list, even when they occur once.

    **Results**

    - `file` (workflow file): One JSON record per line, as a workflow file.
    - `record_count` (whole number): Records written.
    - `sample` (list): The first 5 records.
    - `root_element` (text): The root element's name.
    - `encoding` (text): The document's encoding.
    - `truncated` (yes/no): True when Max records stopped the reading.
    - `warnings` (list): What the step could not do fully or what to check.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
- component_id: steps_select
  type: markdown
  title: Select
  body: |
    ### Select with XPath

    Evaluates an XPath 1.0 expression. Returns values (the text of each node, or the number, text or boolean the expression gives), the matching nodes as XML, or the matching elements as JSON records.

    Action id `select_xpath` · returns values

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `xpath` (text, required): The XPath 1.0 expression, for example //item[price > 10]/title or count(//item).
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `variables` (object): Values for $name variables in the XPath, for example {"sku": "A-1"}.
    - `return` (text): values (default), nodes (each as XML) or records (each element as JSON).
    - `max_results` (whole number): Return at most this many. Default 1000.
    - `attribute_prefix` (text): Put before attribute names in the JSON. Default @.
    - `text_key` (text): The JSON key for an element's text when it also has attributes or children. Default #text.
    - `namespace_mode` (text): keep writes names as the document does (g:price) with their declarations as @xmlns keys; strip keeps local names only. Default keep.
    - `force_list` (list): Element names that are always a JSON list, even when they occur once.

    **Results**

    - `result_type` (text): nodeset, string, number or boolean.
    - `values` (list): The values, nodes or records.
    - `first` (JSON): The first value, or null.
    - `count` (whole number): How many the expression gave.
    - `truncated` (yes/no): True when more matched than were returned.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_check
  type: markdown
  title: Check
  body: |
    ### Check XML

    Checks that a document is well-formed XML and allowed here (no DTD). A problem is returned as a result with its line and column, not as a step failure.

    Action id `check_xml` · returns values

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.

    **Results**

    - `well_formed` (yes/no): True when the document is well-formed and allowed.
    - `errors` (list): Problems: line, column, code and message.
    - `root_element` (text): The root element's name.
    - `root_namespace` (text): The root element's namespace URI.
    - `declared_encoding` (text): The encoding the declaration names.
    - `xml_version` (text): The version the declaration names.
    - `element_count` (whole number): Elements in the document.
    - `max_depth` (whole number): The deepest nesting.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Validate XML against XSD

    Validates a document against an XML Schema (XSD 1.0) given as text or a file. Returns valid and each error with its line and column. A schema made of several files gets the others as files or one ZIP: xs:include, xs:import and xs:redefine are resolved only among them, by name. URLs, absolute paths and ../ are refused; nothing is loaded from the network or the disk.

    Action id `validate_xsd` · returns values

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `schema` (text): The XSD as text. Give it here or as a file, not both.
    - `schema_file` (workflow file): The schema as a workflow file (for example from File Transfer), or give it as text instead.
    - `schema_files` (list): The schema's other files (included or imported), as workflow files or one ZIP of them. Only these are ever read.
    - `schema_name` (text): The main schema's own name, from which its xs:include and xs:import paths are read, for example feed.xsd. Default: the file's name, or schema.xsd for text.
    - `schema_file_names` (list): Names for the other schema files, in the same order, as the main schema refers to them, for example ["types.xsd", "common/units.xsd"]. Default: each file's own name. A ZIP keeps the names inside it.
    - `max_errors` (whole number): List at most this many errors. Default 100.

    **Results**

    - `valid` (yes/no): True when the document matches the schema.
    - `error_count` (whole number): Errors found.
    - `errors` (list): The errors: line, column and message.
    - `warnings` (list): What the step could not do fully or what to check.
