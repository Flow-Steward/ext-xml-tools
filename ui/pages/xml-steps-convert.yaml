- component_id: steps_build
  type: markdown
  title: Build
  body: |
    ### Build XML from records

    Builds an XML document from JSON records and a structure: root, optional wrapper elements, one record element per record, and for each field an element or attribute, nested elements, repeated elements and CDATA. Text is escaped; characters XML 1.0 does not allow stop the step and name the record and field.

    Action id `build_xml` · saves a file

    **Inputs**

    - `records` (JSON): The records: a JSON list of objects. Give them here or as a file (JSON list or JSONL), not both.
    - `records_file` (workflow file): The records as a workflow file (for example from File Transfer), or give it as text instead.
    - `structure` (object, required): For example {"root": "products", "record": "product", "fields": [{"attribute": "id", "value": "id"}, {"element": "title", "value": "title", "cdata": true}]}. See the XML Tools page for every key. Without fields each record's keys become elements.
    - `encoding` (text): The encoding of the XML written, named in its declaration. Default UTF-8.
    - `xml_declaration` (yes/no): Start with <?xml version="1.0" encoding="…"?>. Default on.
    - `pretty` (yes/no): Indent the XML for reading. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `record_count` (whole number): Records written.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_transform
  type: markdown
  title: Transform
  body: |
    ### Transform XML with XSLT

    Applies an XSLT 1.0 stylesheet. The stylesheet cannot read or write files, reach the network or call extensions: document(), xsl:import, xsl:include and exsl:document are refused. The file follows xsl:output method: xml gives result.xml, html result.html, text result.txt.

    Action id `transform_xslt` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `stylesheet` (text): The XSLT stylesheet as text. Give it here or as a file, not both.
    - `stylesheet_file` (workflow file): The stylesheet as a workflow file (for example from File Transfer), or give it as text instead.
    - `parameters` (object): Values for the stylesheet's xsl:param, as text, for example {"currency": "EUR"}.

    **Results**

    - `file` (workflow file): The transformation's output, as a workflow file.
    - `output` (text): The output as text, when it is at most 256 KiB.
    - `file_presentation` (object): The file's name and type for display (html and text output); none for xml.
    - `messages` (list): Texts of xsl:message.
    - `output_method` (text): xml, html or text, as xsl:output method says.
    - `file_name` (text): result.xml, result.html or result.txt.
    - `content_type` (text): The file's type: application/xml or text/plain.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert XML to JSON

    Converts a whole XML document to JSON by the convention of Parse XML to records: attributes as @name, text as #text, repeated elements as lists.

    Action id `xml_to_json` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `attribute_prefix` (text): Put before attribute names in the JSON. Default @.
    - `text_key` (text): The JSON key for an element's text when it also has attributes or children. Default #text.
    - `namespace_mode` (text): keep writes names as the document does (g:price) with their declarations as @xmlns keys; strip keeps local names only. Default keep.
    - `force_list` (list): Element names that are always a JSON list, even when they occur once.

    **Results**

    - `file` (workflow file): The JSON, as a workflow file.
    - `data` (JSON): The JSON value, when the file is at most 256 KiB.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert JSON to XML

    Converts JSON to XML by the same convention: keys become elements, @name keys attributes, #text text, #cdata CDATA, lists repeated elements.

    Action id `json_to_xml` · saves a file

    **Inputs**

    - `data` (JSON): The JSON value. Give it here or as a file, not both.
    - `json_file` (workflow file): The JSON as a workflow file (for example from File Transfer), or give it as text instead.
    - `root_element` (text): Needed when the JSON is not one object with one key (that key is then the root).
    - `item_element` (text): The element for each item of a top-level list. Default item.
    - `attribute_prefix` (text): Put before attribute names in the JSON. Default @.
    - `text_key` (text): The JSON key for an element's text when it also has attributes or children. Default #text.
    - `encoding` (text): The encoding of the XML written, named in its declaration. Default UTF-8.
    - `xml_declaration` (yes/no): Start with <?xml version="1.0" encoding="…"?>. Default on.
    - `pretty` (yes/no): Indent the XML for reading. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert XML to CSV

    Writes one CSV row per record element, reading the file element by element. Columns are given as XPaths or taken from the records' fields.

    Action id `xml_to_csv` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `record_element` (text, required): The repeating element that is one record, for example item, product or g:item (with its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `columns` (list): Optional: [{"name": "price", "xpath": "g:price"}, …], each XPath relative to the record. Without it the columns are the record's flattened fields in the order they first occur.
    - `delimiter` (text): comma (default), semicolon, tab or pipe.
    - `header` (yes/no): Write the column names first. Default on.
    - `excel_bom` (yes/no): Start the file with a UTF-8 byte order mark so Excel reads letters like ą, č correctly. Default off.

    **Results**

    - `file` (workflow file): The CSV (UTF-8), as a workflow file.
    - `csv` (text): The CSV as text, when it is at most 256 KiB.
    - `record_count` (whole number): Rows written (without the header).
    - `columns` (list): The column names.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert CSV to XML

    Turns a CSV with a header row into XML: one record element per row, one child element (or attribute) per column. Column names that are not valid XML names are adjusted and the warnings say how.

    Action id `csv_to_xml` · saves a file

    **Inputs**

    - `csv` (text): The CSV as text. Give it here or as a file, not both.
    - `csv_file` (workflow file): The CSV as a workflow file (for example from File Transfer), or give it as text instead.
    - `delimiter` (text): comma (default), semicolon, tab or pipe.
    - `csv_encoding` (text): The file's encoding. Default UTF-8 (a byte order mark is removed).
    - `root_element` (text): The root element's name. Default rows.
    - `record_element` (text): One element per row. Default row.
    - `attribute_columns` (list): Columns written as attributes of the record element instead of child elements.
    - `skip_empty` (yes/no): Leave out elements for empty cells. Default off: an empty cell is an empty element.
    - `encoding` (text): The encoding of the XML written, named in its declaration. Default UTF-8.
    - `xml_declaration` (yes/no): Start with <?xml version="1.0" encoding="…"?>. Default on.
    - `pretty` (yes/no): Indent the XML for reading. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `record_count` (whole number): Rows written.
    - `columns` (list): Each column and its element name.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert XML to XLSX

    Writes one spreadsheet row per record element to an Excel file (one sheet, a header row, every cell as text), reading the XML element by element.

    Action id `xml_to_xlsx` · saves a file

    **Inputs**

    - `xml` (text): The XML as text. Give it here or as a file, not both.
    - `xml_file` (workflow file): The XML as a workflow file (for example from File Transfer), or give it as text instead.
    - `record_element` (text, required): The repeating element that is one record, for example item, product or g:item (with its prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
    - `namespaces` (object): Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}. A prefix here need not match the document's own.
    - `columns` (list): Optional: [{"name": "price", "xpath": "g:price"}, …], each XPath relative to the record. Without it the columns are the record's flattened fields in the order they first occur.
    - `sheet_name` (text): Default Sheet1.

    **Results**

    - `file` (workflow file): The spreadsheet, as a workflow file.
    - `record_count` (whole number): Rows written (without the header).
    - `columns` (list): The column names.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Convert XLSX to XML

    Turns one sheet of an Excel file (first row = column names) into XML: one record element per row. Values are taken as stored: dates are Excel day numbers, formulas give their last saved result.

    Action id `xlsx_to_xml` · saves a file

    **Inputs**

    - `xlsx_file` (workflow file, required): The XLSX file, as a workflow file (for example from File Transfer).
    - `sheet` (text): The sheet's name. Default the first sheet.
    - `root_element` (text): The root element's name. Default rows.
    - `record_element` (text): One element per row. Default row.
    - `attribute_columns` (list): Columns written as attributes of the record element instead of child elements.
    - `skip_empty` (yes/no): Leave out elements for empty cells. Default off: an empty cell is an empty element.
    - `encoding` (text): The encoding of the XML written, named in its declaration. Default UTF-8.
    - `xml_declaration` (yes/no): Start with <?xml version="1.0" encoding="…"?>. Default on.
    - `pretty` (yes/no): Indent the XML for reading. Default on.

    **Results**

    - `file` (workflow file): The XML, as a workflow file.
    - `xml` (text): The XML as text, when it is at most 256 KiB.
    - `sheet` (text): The sheet read.
    - `record_count` (whole number): Rows written.
    - `columns` (list): Each column and its element name.
    - `size_bytes` (whole number): The result file's size.
    - `sha256` (text): The result file's SHA-256.
    - `warnings` (list): What the step could not do fully or what to check.
