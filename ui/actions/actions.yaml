    required: false
    description: One element per row. Default row.
  - name: attribute_columns
    type: array
    required: false
    description: Columns written as attributes of the record element instead of child elements.
  - name: skip_empty
    type: boolean
    required: false
    description: 'Leave out elements for empty cells. Default off: an empty cell is an empty element.'
  - name: encoding
    type: string
    required: false
    description: The encoding of the XML written, named in its declaration. Default UTF-8.
  - name: xml_declaration
    type: boolean
    required: false
    description: Start with <?xml version="1.0" encoding="…"?>. Default on.
  - name: pretty
    type: boolean
    required: false
    description: Indent the XML for reading. Default on.
  result_fields:
  - file
  - xml
  - sheet
  - record_count
  - columns
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xlsx
  - invalid_name
  - invalid_xml_character
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: edit_xml
  title: Edit XML
  description: 'Applies changes in order, each to the nodes an XPath selects: set text, set or remove
    an attribute, insert an XML fragment, replace, rename or remove. By default a change that selects
    nothing stops the step.'
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml
    type: string
    required: false
    description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: changes
    type: array
    required: true
    description: 'For example [{"action": "set_text", "xpath": "//item[@id=''7'']/price", "value": "9.99"},
      {"action": "remove", "xpath": "//item[stock=0]"}]. Actions: set_text, set_attribute, remove_attribute,
      insert (append, prepend, before or after), replace, rename, remove.'
  - name: namespaces
    type: object
    required: false
    description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  - name: require_match
    type: boolean
    required: false
    description: Stop when a change selects nothing. Default on.
  result_fields:
  - file
  - xml
  - applied
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_xpath
  - no_match
  - invalid_name
  - invalid_xml_character
  - invalid_structure
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: merge_xml
  title: Merge XML documents
  description: 'Joins documents into the first one: the records the XPath selects in each further document
    are added after the last record of the first (for example every item of several feeds into one rss/channel).'
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml_list
    type: array
    required: false
    description: The documents as texts, in order. Files come first, then these.
  - name: xml_files
    type: array
    required: false
    description: The documents as workflow files, in order (for example from File Transfer).
  - name: record_xpath
    type: string
    required: false
    description: XPath 1.0 selecting the records in each document. Default /*/*.
  - name: namespaces
    type: object
    required: false
    description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  result_fields:
  - file
  - xml
  - document_count
  - record_count
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_xpath
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: split_xml
  title: Split XML document
  description: Splits a large document into parts of a set number of records, reading it element by element.
    Each part keeps the elements around the records (for example rss and channel) and, if wanted, the
    elements before the first record. The parts come as one ZIP file.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml
    type: string
    required: false
    description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_element
    type: string
    required: true
    description: The repeating element that is one record, for example item, product or g:item (with its
      prefix in Namespace prefixes). Without a prefix it matches that name in any namespace.
  - name: namespaces
    type: object
    required: false
    description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  - name: records_per_part
    type: integer
    required: true
    description: How many records each part holds.
  - name: copy_header
    type: boolean
    required: false
    description: Copy the elements before the first record (such as a channel's title) into every part.
      Default on.
  result_fields:
  - file
  - part_count
  - record_count
  - parts
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_name
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: format_xml
  title: Format XML
  description: Indents a document for reading, or minifies it by removing whitespace between elements.
    Text with content is kept as it is; xml:space="preserve" is respected when minifying.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml
    type: string
    required: false
    description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: mode
    type: string
    required: false
    description: pretty (default) or minify.
  - name: indent
    type: integer
    required: false
    description: Spaces per level. Default 2.
  - name: remove_comments
    type: boolean
    required: false
    description: Default off.
  - name: encoding
    type: string
    required: false
    description: 'Re-encode to this encoding. Default: keep the document''s.'
  - name: xml_declaration
    type: boolean
    required: false
    description: Start with <?xml version="1.0" encoding="…"?>. Default on.
  result_fields:
  - file
  - xml
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: canonicalize_xml
  title: Canonicalize XML
  description: Writes the canonical form of a document (C14N 1.0, exclusive C14N or C14N 2.0) and its
    SHA-256, so two documents with the same content compare equal byte for byte.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml
    type: string
    required: false
    description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: method
    type: string
    required: false
    description: c14n (default, inclusive 1.0), c14n_exclusive or c14n2.
  - name: with_comments
    type: boolean
    required: false
    description: Default off.
  - name: inclusive_prefixes
    type: array
    required: false
    description: 'For c14n_exclusive: namespace prefixes to keep as in inclusive C14N.'
  result_fields:
  - file
  - xml
  - size_bytes
  - sha256
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
  - artifact_output_unavailable
- action_id: compare_xml
  title: Compare XML documents
  description: 'Compares two documents element by element and lists the differences with their paths:
    names, attributes, text and missing or extra elements. Attribute order never counts.'
  required_scopes:
  - extension:invoke
  - artifact:read
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: left_xml
    type: string
    required: false
    description: The first document as text. Give it here or as a file, not both.
  - name: left_file
    type: artifact_handle
    required: false
    description: The first document as a workflow file (for example from File Transfer), or give it as
      text instead.
  - name: right_xml
    type: string
    required: false
    description: The second document as text. Give it here or as a file, not both.
  - name: right_file
    type: artifact_handle
    required: false
    description: The second document as a workflow file (for example from File Transfer), or give it as
      text instead.
  - name: ignore_whitespace
    type: boolean
    required: false
    description: Compare text with surrounding whitespace removed and runs of spaces as one. Default on.
  - name: ignore_comments
    type: boolean
    required: false
    description: Default on.
  - name: ignore_prefixes
    type: boolean
    required: false
    description: Compare names by namespace URI, not by prefix. Default on.
  - name: max_differences
    type: integer
    required: false
    description: List at most this many. Default 100.
  result_fields:
  - equal
  - difference_count
  - differences
  - truncated
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - artifact_input_unavailable
