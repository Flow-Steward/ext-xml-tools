    type: artifact_handle
    required: false
    description: The records as a workflow file (for example from File Transfer), or give it as text instead.
  - name: structure
    type: object
    required: true
    description: 'For example {"root": "products", "record": "product", "fields": [{"attribute": "id",
      "value": "id"}, {"element": "title", "value": "title", "cdata": true}]}. See the XML Tools page
      for every key. Without fields each record''s keys become elements.'
  - name: encoding
