actions:
- action_id: parse_xml
  title: Parse XML to records
  description: 'Turns an XML document into JSON records: each element the record XPath selects becomes
    one record, with attributes as @name, repeated elements as lists and mixed text kept in order. For
    files too large for the step output use Parse large XML to JSONL file.'
  required_scopes:
  - extension:invoke
  - artifact:read
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: xml
    type: string
    required: false
    description: The XML as text. Give it here or as a file, not both.
  - name: xml_file
    type: artifact_handle
    required: false
    description: The XML as a workflow file (for example from File Transfer), or give it as text instead.
  - name: record_xpath
    type: string
    required: false
    description: XPath 1.0 selecting the record elements. Default /*/* (every child of the root).
  - name: namespaces
    type: object
    required: false
    description: 'Prefixes the XPath or element names use, for example {"g": "http://base.google.com/ns/1.0"}.
      A prefix here need not match the document''s own.'
  - name: flatten
    type: boolean
    required: false
    description: Turn nested values into flat keys such as price.@currency and images.image.0.
  - name: max_records
    type: integer
    required: false
    description: Return at most this many records. Default 10000.
  - name: attribute_prefix
    type: string
    required: false
    description: Put before attribute names in the JSON. Default @.
  - name: text_key
    type: string
    required: false
    description: 'The JSON key for an element''s text when it also has attributes or children. Default
      #text.'
  - name: namespace_mode
    type: string
    required: false
    description: keep writes names as the document does (g:price) with their declarations as @xmlns keys;
      strip keeps local names only. Default keep.
  - name: force_list
    type: array
    required: false
    description: Element names that are always a JSON list, even when they occur once.
  result_fields:
  - records
  - count
  - total
  - truncated
  - root_element
  - warnings
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - unsupported_operation
  - limit_exceeded
  - timeout
  - response_too_large
  - internal_error
  - invalid_xml
  - dtd_forbidden
  - invalid_xpath
  - artifact_input_unavailable
